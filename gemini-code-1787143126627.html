                                        <option value="1000 - 3000 ج.م">1000 - 3000 ج.م</option>
                                        <option value="3000 - 5000 ج.م">3000 - 5000 ج.م</option>
                                        <option value="أكثر من 5000 ج.م">أكثر من 5000 ج.م</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-neutral-300 mb-2">تفاصيل الفكرة أو مشروعك</label>
                                <textarea 
                                    rows="4"
                                    value={contactForm.details}
                                    onChange={(e)=>setContactForm({...contactForm, details: e.target.value})}
                                    placeholder="اكتب وصفاً مختصراً عن المنتج أو الخدمة التي تريد الإعلان عنها..."
                                    className="w-full px-4 py-3 rounded-xl bg-neutral-900 border border-neutral-800 text-xs text-white focus:outline-none focus:border-white transition resize-none"
                                ></textarea>
                            </div>

                            <button 
                                type="submit" 
                                disabled={formSubmitted}
                                className="w-full py-4 rounded-xl bw-btn-primary font-bold text-xs sm:text-sm flex items-center justify-center gap-2"
                            >
                                <i data-lucide="send" className="w-4 h-4"></i>
                                {formSubmitted ? "جاري التوجيه للواتساب..." : "إرسال الطلب مباشرة عبر الواتساب"}
                            </button>
                        </form>
                    </section>

                    <section className="py-16 border-t border-neutral-900 px-4 max-w-7xl mx-auto text-center">
                        <div className="bw-glass rounded-3xl p-10 max-w-4xl mx-auto border border-neutral-800">
                            <h2 className="text-2xl sm:text-4xl font-black text-white mb-4">جاهز لتحويل فكرتك إلى إعلان يلفت الانتباه؟</h2>
                            <p className="text-neutral-400 text-xs sm:text-sm mb-8">تواصل معنا الآن واحصل على استشارة مجانية لمشروعك.</p>
                            <button 
                                onClick={() => triggerWhatsAppOrder("استفسار واستشارة مجانية")}
                                className="bw-btn-primary px-8 py-4 rounded-xl text-sm font-bold inline-flex items-center gap-2"
                            >
                                <i data-lucide="phone-call" className="w-4 h-4"></i>
                                ابدأ مشروعك الآن على الواتساب
                            </button>
                        </div>
                    </section>

                    <footer className="border-t border-neutral-900 bg-neutral-950 py-12 px-4">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 mb-12">
                            <div>
                                <div className="flex items-center gap-2 mb-4">
                                    <div className="w-8 h-8 rounded bg-white text-black font-black flex items-center justify-center text-base">ES</div>
                                    <span className="font-extrabold tracking-wider text-white">AGENCY</span>
                                </div>
                                <p className="text-neutral-400 text-xs leading-relaxed">وكالة صناعة المحتوى البصري، تحريك الأنيميشن، والتصاميم الموجهة لرفع نسبة المبيعات والتفاعل.</p>
                            </div>

                            <div>
                                <h4 className="font-bold text-xs text-white uppercase tracking-wider mb-4">روابط السريعة</h4>
                                <ul className="space-y-2 text-xs text-neutral-400">
                                    <li><a href="#services" className="hover:text-white transition">الخدمات الإعلانية</a></li>
                                    <li><a href="#packs" className="hover:text-white transition">الباقات والأسعار</a></li>
                                    <li><a href="#portfolio" className="hover:text-white transition">معرض الأعمال</a></li>
                                    <li><a href="#policies" className="hover:text-white transition">شروط وضوابط العمل</a></li>
                                </ul>
                            </div>

                            <div>
                                <h4 className="font-bold text-xs text-white uppercase tracking-wider mb-4">التواصل المباشر</h4>
                                <ul className="space-y-2 text-xs text-neutral-400">
                                    <li>الواتساب المباشر: {AGENCY_CONFIG.whatsappNumber}</li>
                                    <li>البريد الإلكتروني: {AGENCY_CONFIG.email}</li>
                                    <li>ساعات العمل: 10:00 ص - 10:00 م</li>
                                </ul>
                            </div>

                            <div>
                                <h4 className="font-bold text-xs text-white uppercase tracking-wider mb-4">منصات التواصل</h4>
                                <div className="flex items-center gap-3">
                                    <a href={AGENCY_CONFIG.social.facebook} target="_blank" className="p-2 rounded-lg bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white transition">
                                        <i data-lucide="facebook" className="w-4 h-4"></i>
                                    </a>
                                    <a href={AGENCY_CONFIG.social.instagram} target="_blank" className="p-2 rounded-lg bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white transition">
                                        <i data-lucide="instagram" className="w-4 h-4"></i>
                                    </a>
                                    <a href={AGENCY_CONFIG.social.tiktok} target="_blank" className="p-2 rounded-lg bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white transition">
                                        <i data-lucide="video" className="w-4 h-4"></i>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto pt-8 border-t border-neutral-900 flex flex-col sm:flex-row items-center justify-between gap-4 text-[11px] text-neutral-500">
                            <p>© {new Date().getFullYear()} {AGENCY_CONFIG.name}. جميع الحقوق محفوظة.</p>
                            <p>تصميم وتطوير واجهة العرض المباشر Production Ready.</p>
                        </div>
                    </footer>

                    <a 
                        href={`${AGENCY_CONFIG.social.whatsapp}?text=${encodeURIComponent("مرحباً، أريد الاستفسار عن خدمات التصميم والمونتاج.")}`}
                        target="_blank"
                        className="fixed bottom-6 left-6 z-40 w-14 h-14 rounded-full bg-white text-black flex items-center justify-center shadow-2xl hover:scale-110 transition border border-neutral-200 group"
                        title="تواصل معنا عبر واتساب"
                    >
                        <i data-lucide="message-circle" className="w-7 h-7"></i>
                    </a>

                    {selectedService && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className="bw-card rounded-3xl p-6 sm:p-8 max-w-lg w-full relative border border-neutral-700 animate-in fade-in duration-200">
                                <button 
                                    onClick={() => setSelectedService(null)}
                                    className="absolute top-4 left-4 text-neutral-400 hover:text-white p-2"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <span className="text-[10px] font-bold px-3 py-1 rounded bg-neutral-800 text-neutral-300 mb-3 inline-block">
                                    {selectedService.badge || selectedService.category}
                                </span>
                                <h3 className="text-xl font-extrabold text-white mb-3">{selectedService.title}</h3>
                                <p className="text-neutral-300 text-xs sm:text-sm leading-relaxed mb-6">{selectedService.description}</p>

                                <div className="space-y-2 mb-6">
                                    <h4 className="text-xs font-bold text-white">أهم المميزات:</h4>
                                    {selectedService.features.map((f, i) => (
                                        <div key={i} className="text-xs text-neutral-400 flex items-center gap-2">
                                            <i data-lucide="check" className="w-3.5 h-3.5 text-white"></i>
                                            {f}
                                        </div>
                                    ))}
                                </div>

                                <div className="p-4 rounded-xl bg-neutral-900 border border-neutral-800 flex justify-between items-center mb-6">
                                    <div>
                                        <span className="text-[10px] text-neutral-500 block">التكلفة الأساسية:</span>
                                        <span className="text-xl font-black text-white">{selectedService.price} ج.م</span>
                                    </div>
                                    <span className="text-xs text-neutral-400">{selectedService.delivery}</span>
                                </div>

                                <button 
                                    onClick={() => {
                                        const srv = selectedService;
                                        setSelectedService(null);
                                        triggerWhatsAppOrder(srv.title, `${srv.price} ج.م`);
                                    }}
                                    className="w-full py-3.5 rounded-xl bw-btn-primary font-bold text-xs sm:text-sm flex items-center justify-center gap-2"
                                >
                                    طلب الخدمة مباشرة
                                </button>
                            </div>
                        </div>
                    )}

                    {selectedPortfolio && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
                            <div className="bw-card rounded-3xl p-6 max-w-xl w-full relative border border-neutral-700">
                                <button 
                                    onClick={() => setSelectedPortfolio(null)}
                                    className="absolute top-4 left-4 text-neutral-400 hover:text-white p-2 z-10"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <div className="w-full aspect-square rounded-2xl overflow-hidden bg-neutral-900 mb-4 border border-neutral-800">
                                    <img src={selectedPortfolio.image} alt={selectedPortfolio.title} className="w-full h-full object-cover" />
                                </div>

                                <h3 className="text-lg font-bold text-white mb-1">{selectedPortfolio.title}</h3>
                                <p className="text-neutral-400 text-xs mb-4">{selectedPortfolio.desc}</p>

                                <button 
                                    onClick={() => {
                                        const port = selectedPortfolio;
                                        setSelectedPortfolio(null);
                                        triggerWhatsAppOrder(`مشروع مماثل لـ: ${port.title}`);
                                    }}
                                    className="w-full py-3 rounded-xl bw-btn-primary font-bold text-xs"
                                >
                                    طلب تصميم مماثل
                                </button>
                            </div>
                        </div>
                    )}

                    {isAdminOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
                            <div className="bw-card rounded-3xl p-6 max-w-md w-full relative border border-neutral-700">
                                <button 
                                    onClick={() => setIsAdminOpen(false)}
                                    className="absolute top-4 left-4 text-neutral-400 hover:text-white p-2"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                {!isAuthenticated ? (
                                    <form onSubmit={handleAdminLogin} className="space-y-4 pt-4">
                                        <div className="text-center mb-4">
                                            <i data-lucide="lock" className="w-8 h-8 text-white mx-auto mb-2"></i>
                                            <h3 className="text-lg font-bold text-white">لوحة الإدارة السريّة</h3>
                                            <p className="text-xs text-neutral-400">أدخل كود المرور للوصول لإمكانية إضافة الخدمات والأعمال</p>
                                        </div>

                                        <input 
                                            type="password"
                                            value={passcode}
                                            onChange={(e) => setPasscode(e.target.value)}
                                            placeholder="أدخل كود المرور"
                                            className="w-full px-4 py-3 rounded-xl bg-neutral-900 border border-neutral-700 text-white text-center text-sm focus:outline-none focus:border-white"
                                        />

                                        <button type="submit" className="w-full py-3 rounded-xl bw-btn-primary font-bold text-xs">
                                            تأكيد الدخول
                                        </button>
                                    </form>
                                ) : (
                                    <div>
                                        <div className="flex border-b border-neutral-800 mb-4 pb-2 gap-4">
                                            <button 
                                                onClick={() => setAdminTab("service")}
                                                className={`text-xs font-bold ${adminTab === "service" ? "text-white border-b-2 border-white pb-1" : "text-neutral-500"}`}
                                            >
                                                + إضافة خدمة
                                            </button>
                                            <button 
                                                onClick={() => setAdminTab("portfolio")}
                                                className={`text-xs font-bold ${adminTab === "portfolio" ? "text-white border-b-2 border-white pb-1" : "text-neutral-500"}`}
                                            >
                                                + إضافة عمل جديد
                                            </button>
                                        </div>

                                        {adminTab === "service" ? (
                                            <form onSubmit={handleAddService} className="space-y-3">
                                                <input 
                                                    type="text" 
                                                    placeholder="عنوان الخدمة"
                                                    value={newItemTitle}
                                                    onChange={(e)=>setNewItemTitle(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-neutral-900 border border-neutral-800 text-xs text-white"
                                                />
                                                <input 
                                                    type="number" 
                                                    placeholder="السعر (بالجنيه)"
                                                    value={newItemPrice}
                                                    onChange={(e)=>setNewItemPrice(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-neutral-900 border border-neutral-800 text-xs text-white"
                                                />
                                                <textarea 
                                                    placeholder="الوصف المختصر"
                                                    value={newItemDesc}
                                                    onChange={(e)=>setNewItemDesc(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-neutral-900 border border-neutral-800 text-xs text-white h-20"
                                                ></textarea>
                                                <button type="submit" className="w-full py-2.5 rounded-xl bw-btn-primary font-bold text-xs">
                                                    حفظ الخدمة
                                                </button>
                                            </form>
                                        ) : (
                                            <form onSubmit={handleAddPortfolio} className="space-y-3">
                                                <input 
                                                    type="text" 
                                                    placeholder="عنوان العمل"
                                                    value={newItemTitle}
                                                    onChange={(e)=>setNewItemTitle(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-neutral-900 border border-neutral-800 text-xs text-white"
                                                />
                                                <input 
                                                    type="text" 
                                                    placeholder="رابط الصورة (Image URL)"
                                                    value={newItemImg}
                                                    onChange={(e)=>setNewItemImg(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-neutral-900 border border-neutral-800 text-xs text-white"
                                                />
                                                <select 
                                                    value={newItemCategory}
                                                    onChange={(e)=>setNewItemCategory(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg bg-neutral-900 border border-neutral-800 text-xs text-white"
                                                >
                                                    <option value="Video">Video</option>
                                                    <option value="Ads">Ads</option>
                                                    <option value="Social Media">Social Media</option>
                                                    <option value="Motion Graphics">Motion Graphics</option>
                                                    <option value="Branding">Branding</option>
                                                </select>
                                                <button type="submit" className="w-full py-2.5 rounded-xl bw-btn-primary font-bold text-xs">
                                                    حفظ العمل
                                                </button>
                                            </form>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
    </script>
</body>
</html>
