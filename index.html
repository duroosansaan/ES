                                    onChange={(e)=>setContactForm({...contactForm, details: e.target.value})}
                                    placeholder="اكتب وصفاً مختصراً عن المنتج أو الخدمة التي تريد الإعلان عنها..."
                                    className="w-full px-4 py-3 rounded-xl bg-zinc-50 border border-zinc-200 text-xs text-black focus:outline-none focus:border-black transition resize-none"
                                ></textarea>
                            </div>

                            <button 
                                type="submit" 
                                className="w-full py-4 rounded-xl bw-btn-primary font-bold text-xs sm:text-sm flex items-center justify-center gap-2"
                            >
                                <i data-lucide="phone" className="w-4 h-4"></i>
                                إرسال الطلب ليقوم خدمة العملاء بالاتصال بي
                            </button>
                        </form>
                    </section>

                    {/* Footer */}
                    <footer className="border-t border-zinc-200 bg-zinc-50 py-12 px-4">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 mb-12">
                            <div>
                                <div className="flex items-center gap-2 mb-4">
                                    <div className="w-8 h-8 rounded bg-black text-white font-black flex items-center justify-center text-base">ES</div>
                                    <span className="font-extrabold tracking-wider text-black">AGENCY</span>
                                </div>
                                <p className="text-zinc-600 text-xs leading-relaxed">وكالة صناعة المحتوى البصري، تحريك الأنيميشن، والتصاميم الموجهة لرفع نسبة المبيعات والتفاعل.</p>
                            </div>

                            <div>
                                <h4 className="font-bold text-xs text-black uppercase tracking-wider mb-4">روابط السريعة</h4>
                                <ul className="space-y-2 text-xs text-zinc-600">
                                    <li><a href="#services" className="hover:text-black transition">الخدمات الإعلانية</a></li>
                                    <li><a href="#packs" className="hover:text-black transition">الباقات والأسعار</a></li>
                                    <li><a href="#portfolio" className="hover:text-black transition">معرض الأعمال</a></li>
                                    <li><a href="#policies" className="hover:text-black transition">شروط وضوابط العمل</a></li>
                                </ul>
                            </div>

                            <div>
                                <h4 className="font-bold text-xs text-black uppercase tracking-wider mb-4">التواصل المباشر</h4>
                                <ul className="space-y-2 text-xs text-zinc-600">
                                    <li>مراسلة ماسنجر المباشرة</li>
                                    <li>اتصل بنا أو اترك رقمك بالنموذج</li>
                                    <li>ساعات العمل: 10:00 ص - 10:00 م</li>
                                </ul>
                            </div>

                            <div>
                                <h4 className="font-bold text-xs text-black uppercase tracking-wider mb-4">منصات التواصل الاجتماعي</h4>
                                <div className="flex items-center gap-3">
                                    <a href={AGENCY_CONFIG.social.facebook} target="_blank" className="p-2.5 rounded-xl bg-white border border-zinc-200 text-zinc-700 hover:text-black hover:border-black transition" title="فيسبوك">
                                        <i data-lucide="facebook" className="w-5 h-5"></i>
                                    </a>
                                    <a href={AGENCY_CONFIG.social.instagram} target="_blank" className="p-2.5 rounded-xl bg-white border border-zinc-200 text-zinc-700 hover:text-black hover:border-black transition" title="إنستجرام">
                                        <i data-lucide="instagram" className="w-5 h-5"></i>
                                    </a>
                                    <a href={AGENCY_CONFIG.social.tiktok} target="_blank" className="p-2.5 rounded-xl bg-white border border-zinc-200 text-zinc-700 hover:text-black hover:border-black transition" title="تيك توك">
                                        <i data-lucide="video" className="w-5 h-5"></i>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto pt-8 border-t border-zinc-200 flex flex-col sm:flex-row items-center justify-between gap-4 text-[11px] text-zinc-500">
                            <p>© {new Date().getFullYear()} {AGENCY_CONFIG.name}. جميع الحقوق محفوظة.</p>
                            <p>تصميم وتطوير واجهة العرض المباشر Production Ready.</p>
                        </div>
                    </footer>

                    {/* Floating Messenger Button */}
                    <button 
                        onClick={openMessenger}
                        className="fixed bottom-6 left-6 z-40 w-14 h-14 rounded-full bg-black text-white flex items-center justify-center shadow-2xl hover:scale-110 transition border border-zinc-800"
                        title="تواصل معنا عبر ماسنجر"
                    >
                        <i data-lucide="message-square" className="w-7 h-7"></i>
                    </button>

                    {/* Success Contact Modal */}
                    {showSuccessModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                            <div className="bw-card rounded-3xl p-6 sm:p-8 max-w-md w-full relative text-center border border-zinc-200 animate-in fade-in">
                                <div className="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i data-lucide="check" className="w-6 h-6"></i>
                                </div>
                                <h3 className="text-lg font-bold text-black mb-2">تم استلام طلبك بنجاح!</h3>
                                <p className="text-zinc-600 text-xs mb-6 leading-relaxed">
                                    شكراً لك يا <strong>{contactForm.name}</strong>. سيقوم فريق خدمة العملاء بالاتصال بك على رقمك (<strong>{contactForm.phone}</strong>) في أقرب وقت.
                                </p>
                                <div className="space-y-2">
                                    <button 
                                        onClick={() => { setShowSuccessModal(false); openMessenger(); }}
                                        className="w-full py-3 rounded-xl bw-btn-primary font-bold text-xs flex items-center justify-center gap-2"
                                    >
                                        <i data-lucide="message-square" className="w-4 h-4"></i>
                                        أو تواصل معنا فوراً عبر ماسنجر
                                    </button>
                                    <button 
                                        onClick={() => {
                                            setShowSuccessModal(false);
                                            setContactForm({ name: "", phone: "", service: "تصميم فيديو إعلاني", budget: "300 - 1000 ج.م", details: "" });
                                        }}
                                        className="w-full py-2.5 rounded-xl text-zinc-500 text-xs font-semibold hover:text-black"
                                    >
                                        إغلاق
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Selected Service Modal */}
                    {selectedService && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                            <div className="bw-card rounded-3xl p-6 sm:p-8 max-w-lg w-full relative border border-zinc-200">
                                <button 
                                    onClick={() => setSelectedService(null)}
                                    className="absolute top-4 left-4 text-zinc-400 hover:text-black p-2"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <span className="text-[10px] font-bold px-3 py-1 rounded bg-zinc-100 text-zinc-800 mb-3 inline-block">
                                    {selectedService.badge || selectedService.category}
                                </span>
                                <h3 className="text-xl font-extrabold text-black mb-3">{selectedService.title}</h3>
                                <p className="text-zinc-700 text-xs sm:text-sm leading-relaxed mb-6">{selectedService.description}</p>

                                <div className="space-y-2 mb-6">
                                    <h4 className="text-xs font-bold text-black">أهم المميزات:</h4>
                                    {selectedService.features.map((f, i) => (
                                        <div key={i} className="text-xs text-zinc-600 flex items-center gap-2">
                                            <i data-lucide="check" className="w-3.5 h-3.5 text-black"></i>
                                            {f}
                                        </div>
                                    ))}
                                </div>

                                <div className="p-4 rounded-xl bg-zinc-50 border border-zinc-200 flex justify-between items-center mb-6">
                                    <div>
                                        <span className="text-[10px] text-zinc-500 block">التكلفة الأساسية:</span>
                                        <span className="text-xl font-black text-black">{selectedService.price} ج.م</span>
                                    </div>
                                    <span className="text-xs text-zinc-600 font-medium">{selectedService.delivery}</span>
                                </div>

                                <button 
                                    onClick={() => {
                                        setSelectedService(null);
                                        openMessenger();
                                    }}
                                    className="w-full py-3.5 rounded-xl bw-btn-primary font-bold text-xs sm:text-sm flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="message-square" className="w-4 h-4"></i>
                                    طلب الخدمة عبر ماسنجر
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Selected Portfolio Item Modal */}
                    {selectedPortfolio && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                            <div className="bw-card rounded-3xl p-6 max-w-xl w-full relative border border-zinc-200">
                                <button 
                                    onClick={() => setSelectedPortfolio(null)}
                                    className="absolute top-4 left-4 text-zinc-400 hover:text-black p-2 z-10"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <div className="w-full aspect-square rounded-2xl overflow-hidden bg-zinc-100 mb-4 border border-zinc-200">
                                    <img src={selectedPortfolio.image} alt={selectedPortfolio.title} className="w-full h-full object-cover" />
                                </div>

                                <h3 className="text-lg font-bold text-black mb-1">{selectedPortfolio.title}</h3>
                                <p className="text-zinc-600 text-xs mb-4">{selectedPortfolio.desc}</p>

                                <button 
                                    onClick={() => {
                                        setSelectedPortfolio(null);
                                        openMessenger();
                                    }}
                                    className="w-full py-3 rounded-xl bw-btn-primary font-bold text-xs flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="message-square" className="w-4 h-4"></i>
                                    طلب تصميم مماثل عبر ماسنجر
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Admin Modal (With Delete/Edit & File Upload) */}
                    {isAdminOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                            <div className="bw-card rounded-3xl p-6 max-w-2xl w-full relative border border-zinc-200 max-h-[90vh] overflow-y-auto">
                                <button 
                                    onClick={() => { setIsAdminOpen(false); resetPortfolioForm(); }}
                                    className="absolute top-4 left-4 text-zinc-400 hover:text-black p-2"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                {!isAuthenticated ? (
                                    <form onSubmit={handleAdminLogin} className="space-y-4 pt-4 text-center">
                                        <i data-lucide="lock" className="w-8 h-8 text-black mx-auto mb-2"></i>
                                        <h3 className="text-lg font-bold text-black">لوحة الإدارة والتعديل</h3>
                                        <p className="text-xs text-zinc-500">أدخل كود المرور للوصول لإمكانية تعديل وحذف وإضافة التصاميم</p>

                                        <input 
                                            type="password"
                                            value={passcode}
                                            onChange={(e) => setPasscode(e.target.value)}
                                            placeholder="أدخل الرقم السري (مثال: 12345)"
                                            className="w-full px-4 py-3 rounded-xl bg-zinc-50 border border-zinc-300 text-black text-center text-sm focus:outline-none focus:border-black"
                                        />

                                        <button type="submit" className="w-full py-3 rounded-xl bw-btn-primary font-bold text-xs">
                                            تأكيد الدخول
                                        </button>
                                    </form>
                                ) : (
                                    <div>
                                        <div className="flex border-b border-zinc-200 mb-6 gap-4">
                                            <button 
                                                onClick={() => { resetPortfolioForm(); setAdminTab("manage_portfolio"); }}
                                                className={`text-xs font-bold pb-2 ${adminTab === "manage_portfolio" ? "text-black border-b-2 border-black" : "text-zinc-500"}`}
                                            >
                                                إدارة وحذف التصاميم ({portfolio.length})
                                            </button>
                                            <button 
                                                onClick={() => setAdminTab("add_portfolio")}
                                                className={`text-xs font-bold pb-2 ${adminTab === "add_portfolio" ? "text-black border-b-2 border-black" : "text-zinc-500"}`}
                                            >
                                                {editingPortfolioId ? "تعديل التصميم" : "+ إضافة تصميم جديد (صورة من الجهاز)"}
                                            </button>
                                        </div>

                                        {adminTab === "manage_portfolio" && (
                                            <div className="space-y-3">
                                                <h4 className="text-xs font-bold text-zinc-600 mb-2">قائمة التصاميم الحالية في معرض الأعمال:</h4>
                                                {portfolio.map((item) => (
                                                    <div key={item.id} className="flex items-center justify-between p-3 rounded-xl bg-zinc-50 border border-zinc-200">
                                                        <div className="flex items-center gap-3">
                                                            <img src={item.image} alt={item.title} className="w-12 h-12 rounded-lg object-cover border border-zinc-200" />
                                                            <div>
                                                                <h5 className="text-xs font-bold text-black">{item.title}</h5>
                                                                <span className="text-[10px] text-zinc-500">{item.category}</span>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <button 
                                                                onClick={() => handleEditPortfolioClick(item)}
                                                                className="px-3 py-1.5 rounded-lg bg-black text-white text-[11px] font-bold"
                                                            >
                                                                تعديل
                                                            </button>
                                                            <button 
                                                                onClick={() => handleDeletePortfolio(item.id)}
                                                                className="px-3 py-1.5 rounded-lg bg-red-600 text-white text-[11px] font-bold"
                                                            >
                                                                حذف
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {adminTab === "add_portfolio" && (
                                            <form onSubmit={handleAddOrUpdatePortfolio} className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-zinc-700 mb-1">عنوان العمل *</label>
                                                    <input 
                                                        type="text" 
                                                        placeholder="مثال: تصميم إعلان منتج عطور"
                                                        value={newItemTitle}
                                                        onChange={(e)=>setNewItemTitle(e.target.value)}
                                                        className="w-full p-3 rounded-xl bg-zinc-50 border border-zinc-300 text-xs text-black focus:outline-none focus:border-black"
                                                    />
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-bold text-zinc-700 mb-1">رفع صورة من جهازك *</label>
                                                    <input 
                                                        type="file" 
                                                        accept="image/*"
                                                        onChange={handleImageFileChange}
                                                        className="w-full p-2 rounded-xl bg-zinc-50 border border-zinc-300 text-xs text-zinc-700 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-black file:text-white"
                                                    />
                                                    {newItemImg && (
                                                        <div className="mt-2 flex items-center gap-2">
                                                            <img src={newItemImg} alt="Preview" className="w-16 h-16 rounded-lg object-cover border border-zinc-300" />
                                                            <span className="text-[11px] text-green-600 font-bold">تم تحميل الصورة جاهزة للحفظ</span>
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="grid grid-cols-2 gap-3">
                                                    <div>
                                                        <label className="block text-xs font-bold text-zinc-700 mb-1">قسم العمل</label>
                                                        <select 
                                                            value={newItemCategory}
                                                            onChange={(e)=>setNewItemCategory(e.target.value)}
                                                            className="w-full p-3 rounded-xl bg-zinc-50 border border-zinc-300 text-xs text-black"
                                                        >
                                                            <option value="Video">Video</option>
                                                            <option value="Ads">Ads</option>
                                                            <option value="Social Media">Social Media</option>
                                                            <option value="Motion Graphics">Motion Graphics</option>
                                                            <option value="Branding">Branding</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-zinc-700 mb-1">أبعاد العرض</label>
                                                        <select 
                                                            value={newItemRatio}
                                                            onChange={(e)=>setNewItemRatio(e.target.value)}
                                                            className="w-full p-3 rounded-xl bg-zinc-50 border border-zinc-300 text-xs text-black"
                                                        >
                                                            <option value="aspect-square">مربع (1:1)</option>
                                                            <option value="aspect-portrait">طولي بوستر (4:5)</option>
                                                            <option value="aspect-story">ستوري/ريلز (9:16)</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-bold text-zinc-700 mb-1">الوصف المختصر</label>
                                                    <textarea 
                                                        placeholder="تفاصيل مختصرة عن التصميم..."
                                                        value={newItemDesc}
                                                        onChange={(e)=>setNewItemDesc(e.target.value)}
                                                        className="w-full p-3 rounded-xl bg-zinc-50 border border-zinc-300 text-xs text-black h-20 resize-none"
                                                    ></textarea>
                                                </div>

                                                <div className="flex gap-2">
                                                    <button type="submit" className="flex-1 py-3 rounded-xl bw-btn-primary font-bold text-xs">
                                                        {editingPortfolioId ? "حفظ التعديلات" : "إضافة لمعرض الأعمال"}
                                                    </button>
                                                    {editingPortfolioId && (
                                                        <button 
                                                            type="button" 
                                                            onClick={resetPortfolioForm}
                                                            className="px-4 py-3 rounded-xl bg-zinc-200 text-black font-bold text-xs"
                                                        >
                                                            إلغاء
                                                        </button>
                                                    )}
                                                </div>
                                            </form>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
    </script>
</body>
</html>
